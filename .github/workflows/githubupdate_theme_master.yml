name: 레거시 테마 마스터 자동 갱신

on:
  schedule:
    # UTC 23:00 (일~목) = KST 08:00 (월~금, 장 시작 전)
    - cron: "0 23 * * 0-4"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write            # data/themes/*.csv 커밋용

concurrency:
  group: theme-master-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 레거시 인포스탁 테마 분류 재수집
        run: python legacy_theme_classifier.py --output-dir data/themes --refresh --workers 8

      - name: 변경 사항 커밋 및 푸시
        run: |
          if [[ -n "$(git status --porcelain data/themes)" ]]; then
            git config user.name  "theme-master-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/themes
            git commit -m "chore: 레거시 테마 마스터 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "변경 없음"
          fi
