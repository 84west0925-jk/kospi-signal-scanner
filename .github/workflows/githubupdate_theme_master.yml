name: 레거시 테마 마스터 자동 갱신

on:
  schedule:
    # UTC 23:00 (일~목) = KST 08:00 (월~금, 장 시작 전)
    - cron: "0 23 * * 0-4"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write            # data/themes/*.csv 커밋용

concurrency:
  group: theme-master-update
  cancel-in-progress: false

jobs:
  update:
    # ubuntu-latest → Ubuntu 26 자동 전환(2026-10-19) 영향 차단을 위해 버전 고정
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 레거시 인포스탁 테마 분류 재수집
        # 2026-10 네이버 구 시세 페이지 폐지 → JSON API 수집으로 전환
        # 수집 실패 시 job 실패 처리 → GitHub 실패 메일 발송 (커밋 단계 생략으로 직전 CSV는 보존)
        # 동시 요청 8 → 3 으로 축소 (차단 리스크 완화, 소요 약 5~7분)
        env:
          NAVER_REQUEST_DELAY: "0.3"
        run: python legacy_theme_classifier.py --output-dir data/themes --refresh --workers 3

      - name: 변경 사항 커밋 및 푸시
        run: |
          if [[ -n "$(git status --porcelain data/themes)" ]]; then
            git config user.name  "theme-master-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/themes
            git commit -m "chore: 레거시 테마 마스터 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 다른 워크플로(단타 알림 상태 커밋)와 충돌 방지
            git pull --rebase origin main
            git push
          else
            echo "변경 없음"
          fi
