name: KOSPI 단타 RSI 알림 (백업 경로)

# 실제 장중 알림의 주력은 PC에서 상시 실행하는 kis_alert_runner.py 입니다.
# 이 워크플로는 PC가 꺼져 있을 때를 대비한 **백업**이며,
# KIS 키가 등록돼 있지 않으면 자동으로 yfinance 마감봉 경로로 동작합니다.
# 같은 신호는 swing_positions.json 의 alerted 기록으로 중복 차단됩니다.

on:
  schedule:
    # UTC 기준 — 한국 09:00~15:40 = UTC 00:00~06:40, 10분 간격 (평일)
    # GitHub 무료 플랜의 schedule 은 상당수 건너뜁니다. 백업 용도이므로 감수합니다.
    - cron: "0,10,20,30,40,50 0-6 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "0=평상시 / 1=휴장·시간제한 무시 강제 스캔 / test=알림 연결 테스트"
        default: "0"

permissions:
  contents: write           # 포지션 상태 파일 커밋용

concurrency:
  group: swing-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 신호 스캔 및 알림
        env:
          GH_PAT:              ${{ secrets.GH_PAT }}
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          # KIS 키는 선택입니다. 비어 있으면 yfinance 백업 경로로 자동 전환됩니다.
          KIS_APP_KEY:         ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:      ${{ secrets.KIS_APP_SECRET }}
          INTERVAL: "30m"
          RSI_BUY:  "30"
          RSI_SELL: "70"
          SEED:     "3000000"
          FORCE:    ${{ github.event.inputs.force || '0' }}
        run: python alert_bot.py

      - name: 포지션 상태 저장
        if: always()
        run: |
          if [[ -n "$(git status --porcelain swing_positions.json)" ]]; then
            git config user.name  "swing-bot"
            git config user.email "bot@users.noreply.github.com"
            git add swing_positions.json
            git commit -m "chore: 단타 알림 상태 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "변경 없음"
          fi
